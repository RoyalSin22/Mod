# Compila el mod y ejecuta las pruebas en cada push y en cada pull request.
# El resultado aparece en la pestaña «Actions» de GitHub y junto a cada commit (✔ / ✖).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar y probar
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publicar el .jar del mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aptitudes-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Publicar los informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-pruebas
          path: build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
