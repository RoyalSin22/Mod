plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

// Versión según el número de commits (decisión del autor): centenas, decenas y unidades, p. ej. 123 commits -> 1.2.3
// (1234 -> 12.3.4). Sin historia de git completa (ZIP de GitHub o clon superficial) se usa mod_version de
// gradle.properties como respaldo.
static String versionFromCommits(int count) {
	return "${count.intdiv(100)}.${count.intdiv(10) % 10}.${count % 10}"
}

def gitCommitCount = {
	try {
		def shallow = providers.exec {
			commandLine 'git', 'rev-parse', '--is-shallow-repository'
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
		if (shallow != 'false') return null
		def count = providers.exec {
			commandLine 'git', 'rev-list', '--count', 'HEAD'
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
		return count ==~ /\d+/ ? count.toInteger() : null
	} catch (Exception ignored) {
		return null
	}
}()

version = gitCommitCount != null ? versionFromCommits(gitCommitCount) : project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file('src/main/resources/aptitudes.accesswidener')
	// Separa el código de cliente (GUI, keybinds) del común: evita cargar
	// clases de cliente en un servidor dedicado.
	splitEnvironmentSourceSets()

	mods {
		"aptitudes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// v40: Mod Menu (dependencia opcional, solo para compilar). Excepción aprobada por el autor; ver AGENTS.md.
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	// v63: GeckoLib (dependencia obligatoria para los jefes animados). Excepción aprobada por el autor; ver AGENTS.md.
	maven {
		name = "GeckoLib"
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
		content { includeGroup "software.bernie.geckolib" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// v40: integración opcional con Mod Menu (no se incluye en el .jar ni es obligatoria).
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// v63: GeckoLib fijado; sin transitivas para no mover las versiones fijadas de Loader y Fabric API.
	modImplementation("software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}") { transitive = false }

	// Pruebas unitarias (src/test/java). Se ejecutan con ./gradlew test (y en build).
	// JUnit Platform con dos motores: Jupiter (JUnit 5) y Vintage (JUnit 4), así conviven pruebas de ambos tipos.
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "junit:junit:4.13.2"
	testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
